name: Translate Subtitles

on:
  push:
    paths:
      - 'srt/*.srt'
      - '*.go'
      - 'core/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*.yml'

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      
      - name: Install translate-shell
        run: sudo apt-get update && sudo apt-get install -y translate-shell
      
      - name: Verify translate-shell installation
        run: |
          trans --version
          echo "Testing translation..."
          trans -e google -src auto -target en "你好"
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run translation
        run: go run main.go
      
      - name: Debug - Check generated files
        if: always()
        run: |
          echo "=== Checking srt directory ==="
          ls -la srt/ | head -30
          echo ""
          echo "=== Checking for _zhs files ==="
          ls srt/*_zhs.srt 2>/dev/null || echo "No _zhs.srt files found"
          echo ""
          echo "=== Counting files ==="
          echo "Total srt files: $(ls srt/*.srt 2>/dev/null | wc -l)"
          echo "Translated files: $(ls srt/*_zhs.srt 2>/dev/null | wc -l)"
      
      - name: Sanitize translated filenames
        run: |
          cd srt
          for f in *_zhs.srt; do
            newname=$(echo "$f" | sed 's/[?:<>|*"\/\\]/_/g' | tr '\r\n' '__')
            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi
          done

      - name: Upload translated subtitles artifact
        uses: actions/upload-artifact@v7
        with:
          name: translated-subtitles
          path: srt/*.srt
          retention-days: 30
