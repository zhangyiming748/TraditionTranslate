name: Translate Subtitles

on:
  push:
    paths:
      - 'srt/**'
      - '*.go'
      - 'core/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*.yml'

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      
      - name: Install translate-shell
        run: sudo apt-get update && sudo apt-get install -y translate-shell tree
      
      - name: Verify translate-shell installation
        run: |
          trans --version
          echo "Testing translation..."
          trans -e google -src auto -target en "你好"
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run translation
        run: go run main.go
      
      - name: List all files
        run: tree ${{ github.workspace }}
      
      - name: Pack SRT files into tar archive
        run: |
          cd ${{ github.workspace }}
          find srt -type f -iname '*_zhs.srt' -print0 | tar -cf translated-srt.tar --null -T -
          tar -tf translated-srt.tar | head -n 20
          echo "共打包 $(tar -tf translated-srt.tar | wc -l) 个翻译后的 SRT 文件"
      
      - name: Upload translated subtitles artifact
        uses: actions/upload-artifact@v7
        with:
          name: translated-subtitles
          path: translated-srt.tar
          retention-days: 30
          if-no-files-found: error
