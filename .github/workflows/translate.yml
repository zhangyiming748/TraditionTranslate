name: Translate Subtitles

on:
  push:
    paths:
      - '*.srt'
      - '*.go'
      - 'core/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*.yml'

jobs:
  translate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      
      - name: Install translate-shell
        run: sudo apt-get update && sudo apt-get install -y translate-shell
      
      - name: Verify translate-shell installation
        run: |
          trans --version
          echo "Testing translation..."
          trans -e google -src auto -target en "你好"
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run translation
        run: go run main.go
      
      - name: Upload translated subtitles artifact
        uses: actions/upload-artifact@v7
        with:
          name: translated-subtitles
          path: srt/*_zhs.srt
          retention-days: 30
